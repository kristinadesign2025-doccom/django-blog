{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой блог{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <div class="container">
                <h1><a href="{% url 'blog:home' %}">Мой блог</a></h1>
                <ul>
                    <li><a href="{% url 'blog:home' %}">Главная</a></li>
                    <li><a href="{% url 'blog:about' %}">О блоге</a></li>
                    <li><a href="{% url 'blog:reviews' %}">Отзывы</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Мой блог. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
